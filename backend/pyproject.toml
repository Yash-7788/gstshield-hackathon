[project]
name = "gstshield-backend"
version = "0.0.1"
description = "GSTShield local hackathon website backend"
requires-python = ">=3.13,<3.14"
dependencies = [
    "defusedxml>=0.7.1,<0.8",
    "fastapi>=0.142.2,<0.143",
    "openpyxl>=3.1.5,<3.2",
    "psutil>=7,<8",
    "pydantic>=2.13.5,<3",
    "pydantic-settings>=2.15,<3",
    "python-dotenv>=1.2.4,<2",
    "python-multipart>=0.0.32,<0.1",
    "rapidfuzz>=3.14.6,<3.15",
    "reportlab>=5.0.1,<5.1",
    "uvicorn>=0.54,<1",
]

[dependency-groups]
dev = [
    "httpx2>=2.13.1,<3",
    "pymupdf>=1.26,<2",
    "pypdf>=6,<7",
    "pytest>=9.1.1,<10",
    "ruff>=0.16.10,<1",
]

[tool.uv]
package = false

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
filterwarnings = ["error"]
