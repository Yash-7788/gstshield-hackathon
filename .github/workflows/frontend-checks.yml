name: Internal website checks

on:
  push:
    paths: ['frontend/**', 'backend/app/**', 'backend/uv.lock', '.github/workflows/frontend-checks.yml']
  pull_request:
    paths: ['frontend/**', 'backend/app/**', 'backend/uv.lock', '.github/workflows/frontend-checks.yml']

permissions:
  contents: read

concurrency:
  group: website-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  website:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.19.0'
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: '0.12.22'
      - run: uv sync --frozen
        working-directory: backend
      - run: npm install --global pnpm@11.19.0
      - run: pnpm install --frozen-lockfile
        working-directory: frontend
      - run: pnpm check:contracts && pnpm check:format && pnpm test && pnpm build
        working-directory: frontend
      - run: pnpm exec playwright install --with-deps chromium
        working-directory: frontend
      - run: pnpm test:browser && pnpm test:preview
        working-directory: frontend
